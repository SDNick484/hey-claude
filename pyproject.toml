[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hey-claude"
version = "0.1.0"
description = "Voice-activated launcher for Claude Code on Linux: say \"Hey Claude\" and start a session hands-free."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "sherpa-onnx>=1.10",
    "sentencepiece>=0.1.99",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
# Global push-to-talk by reading /dev/input directly (needs membership in the `input` group).
evdev = ["evdev>=1.6"]
dev = ["pytest>=7"]

[project.scripts]
hey-claude = "hey_claude.cli:main"

[tool.setuptools.packages.find]
include = ["hey_claude*"]

[tool.setuptools.package-data]
hey_claude = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
